name: pillpal
description: "PillPal — Med-Tracker: scan a prescription label (live camera OCR, no photo taken), confirm the fields, get refill reminders."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_slidable: 3.1.2

  # Live-scan capture (med-tracker-spec.md §1) + backup photo-upload fallback.
  # No image_picker: the upload fallback reads picked-photo bytes straight
  # into memory via a custom Android platform channel (MainActivity.kt) to
  # keep the same zero-disk-write guarantee the live scan has -- image_picker
  # always copies through its own cache file first, with no way to opt out.
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_commons: ^0.13.0
  permission_handler: ^11.3.1
  # >=1.5.1 required for Android's 16 KB page-size compliance (targetSdk 36).
  flutter_onnxruntime: ^1.8.5

  # Local persistence (profiles/prescriptions/dose history), encrypted at rest.
  # Not sqlite3_flutter_libs/sqlcipher_flutter_libs -- both end-of-life as of
  # sqlite3 3.x/drift 2.32+. The `hooks` block below swaps the bundled SQLite
  # build for SQLite3MultipleCiphers; see data/local/connection.dart and
  # encryption_key.dart for how the key is generated/applied.
  drift: ^2.23.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^11.2.0

  # Real reminder delivery for Prescription.reminderTimes (exact, daily-
  # repeating alarms -- see core/scheduling/reminder_scheduler.dart for the
  # bedtime-aware decision logic this schedules on top of).
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

  # Real "Export Local Data" -- shares the actual (encrypted) pillpal.sqlite
  # file via the OS share sheet, instead of just claiming success.
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    # distilled NER model + tokenizer + RxNorm drug list, produced by
    # ../distill/export_onnx.py --emit assets/ner  (see assets/ner/README.md)
    - assets/ner/

# Bundles SQLite3MultipleCiphers instead of plain SQLite, giving the sqlite3
# package's native build real encryption support (PRAGMA key/rekey). See
# https://drift.simonbinder.eu/platforms/encryption/.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

# Still to add later:
#   local_auth  - biometric / PIN app lock
